name: macOS Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  macos-integration:
    name: macOS Integration Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Print SDK versions
        run: |
          flutter --version
          dart --version

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Install dependencies (plugin root)
        run: flutter pub get

      - name: Analyze macOS platform code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --reporter=expanded

      - name: Install dependencies (example app)
        working-directory: example
        run: flutter pub get

      - name: Build example app for macOS (debug)
        working-directory: example
        run: flutter build macos --debug

      - name: Run integration tests on macOS
        working-directory: example
        run: |
          flutter test integration_test/plugin_integration_test.dart \
            -d macos \
            --reporter=expanded
