name: media_manager
description: "A Flutter plugin for managing media files on Android, iOS, and macOS — paginated queries, on-disk thumbnail cache, and storage permission handling."
version: 1.0.4
homepage: "https://github.com/SwanFlutter/media_manager"
repository: "https://github.com/SwanFlutter/media_manager"
issue_tracker: "https://github.com/SwanFlutter/media_manager/issues"
documentation: "https://github.com/SwanFlutter/media_manager/blob/main/README.md"
topics:
  - media
  - gallery
  - image
  - video
  - audio

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.example.media_manager
        pluginClass: MediaManagerPlugin
      ios:
        pluginClass: MediaManagerPlugin
      macos:
        pluginClass: MediaManagerPlugin

